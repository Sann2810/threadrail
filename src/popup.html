<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ThreadRail</title><link rel="stylesheet" href="extension.css"></head>
<body class="popup"><header><span class="logo">≋</span><strong>ThreadRail</strong><span class="version">1.6.0</span></header>
<p class="tagline">Find your place. Faster.</p><section class="card"><strong id="provider">Checking this page…</strong><p id="status" role="status">Everything stays in your browser.</p></section>
<button id="toggle" class="primary" disabled>Enable on this site</button><button id="configure" class="secondary">Set up another chat interface</button>
<button id="library" class="secondary">Search all chats</button>
<button id="diagnostics" class="secondary">Test search</button>
<p class="hint">Scroll into an earlier exchange to reveal the rail. Click a marker to preview, then select the question to jump.</p><p id="error" class="error" role="alert"></p><footer>Chat library stays on this device. No cloud search.</footer><script src="popup.js"></script></body></html>
